<!DOCTYPE html>
<html>
<head>
  <title>buat website</title>
  <style>
    /* Tambahan: warna teks input biar kelihatan di latar hitam */
    input {
      background: #111;
      color: white;
    }
  </style>
</head>
<body style="background-color: black; margin: 0;">

<!-- LOGO — TIDAK DIUBAH -->
<img 
  src="assets/images/logo.jpg" 
  alt="Logo"
  style="
    position: absolute;
    left: 150px;
    top: 50px;
    width: 150px;
    height: 150px;
    object-fit: contain;
  "
>

<!-- INPUT — TIDAK DIUBAH, cuma tambah id="inputKey" -->
<input 
  type="text"
  id="inputKey"
  placeholder="Enter Key"
  style="
    position: absolute;
    left: 100px;
    top: 220px;
    width: 280px;
    height: 45px;
    font-size: 16px;
    padding: 0 12px;
    border: 2px solid #ccc;
    border-radius: 8px;
    outline: none;
  "
>

<!-- BUTTON — TIDAK DIUBAH, cuma tambah onclick="cekKey()" -->
<button 
  type="button"
  onclick="cekKey()"
  style="
    position: absolute;
    left: 100px;
    top: 280px;
    width: 280px;
    height: 50px;
    font-size: 18px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  "
>
  Login
</button>

<!-- PESAN SALAH — TAMBAHAN BARU -->
<div 
  id="pesanSalah"
  style="
    position: absolute;
    left: 100px;
    top: 345px;
    color: #ff4d4d;
    font-size: 14px;
    display: none;
  "
>
 Key Wrong
</div>

<!-- FOOTER — TIDAK DIUBAH -->
<div 
  style="
    position: absolute;
    left: 170px;
    top: 800px;
    width: 250px;
    height: 40px;
    font-size: 20px;
    color: #D3D3D3;
    font-weight: bold;
    text-align: left;
    line-height: 40px;
  "
>
  © 2nedwill 
</div>

<!-- ============================================== -->
<!-- ✅ TAMBAHAN: JAVASCRIPT CEK KODE — TIDAK MENGUBAH YANG LAIN -->
<!-- ============================================== -->
<script>
// ============== UBAH KODE DI SINI ==============
const KODE_BENAR = "rangga"; // ← Ganti jadi kode kamu!
// ================================================

function cekKey() {
  const inputUser = document.getElementById('inputKey').value.trim();
  const pesanSalah = document.getElementById('pesanSalah');

  if (inputUser === KODE_BENAR) {
    // ✅ Benar → ke splash.html
    window.location.href = "splash.html";
  } else {
    // ❌ Salah → tampilkan pesan
    pesanSalah.style.display = 'block';
    setTimeout(() => {
      pesanSalah.style.display = 'none';
    }, 3000);
  }
}

// Bisa tekan Enter di keyboard
document.getElementById('inputKey').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') cekKey();
});
</script>

</body>
</html>
