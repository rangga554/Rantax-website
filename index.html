<!DOCTYPE html>
<html>
<head>
  <title>buat website</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    input {
      background: #111;
      color: white;
    }
  </style>
</head>
<body style="background-color: black; margin: 0; width: 100%; height: 100%; position: relative;">

<!-- LOGO — DIPERBAIKI POSISI TENGAH ATAS -->
<img 
  src="assets/images/logo.jpg" 
  alt="Logo"
  style="
    position: absolute;
    left: 50%;
    top: 60px;
    transform: translateX(-50%);
    width: 120px;
    height: 120px;
    object-fit: contain;
  "
>

<!-- INPUT — TENGAH, UKURAN RAPI -->
<input 
  type="text"
  id="inputKey"
  placeholder="Enter Key"
  style="
    position: absolute;
    left: 50%;
    top: 230px;
    transform: translateX(-50%);
    width: 280px;
    height: 48px;
    font-size: 16px;
    padding: 0 15px;
    border: 2px solid #444;
    border-radius: 10px;
    outline: none;
    background: #1a1a1a;
    color: white;
  "
>

<!-- BUTTON — TENGAH, UKURAN PAS -->
<button 
  type="button"
  onclick="cekKey()"
  style="
    position: absolute;
    left: 50%;
    top: 305px;
    transform: translateX(-50%);
    width: 280px;
    height: 52px;
    font-size: 17px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.15s;
  "
  onmousedown="this.style.transform='translateX(-50%) scale(0.97)'"
  onmouseup="this.style.transform='translateX(-50%) scale(1)'"
  onmouseout="this.style.transform='translateX(-50%) scale(1)'"
>
  Login
</button>

<!-- PESAN SALAH — TENGAH -->
<div 
  id="pesanSalah"
  style="
    position: absolute;
    left: 50%;
    top: 375px;
    transform: translateX(-50%);
    color: #ff4d4d;
    font-size: 14px;
    display: none;
    text-align: center;
  "
>
  Key Wrong
</div>

<!-- FOOTER — TENGAH BAWAH -->
<div 
  style="
    position: absolute;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    font-size: 15px;
    color: #D3D3D3;
    font-weight: bold;
    text-align: center;
  "
>
  © 2nedwill 
</div>

<!-- JAVASCRIPT — TETAP SAMA PERSIS -->
<script>
const KODE_BENAR = "rangga";

function cekKey() {
  const inputUser = document.getElementById('inputKey').value.trim();
  const pesanSalah = document.getElementById('pesanSalah');

  if (inputUser === KODE_BENAR) {
    window.location.href = "splash.html";
  } else {
    pesanSalah.style.display = 'block';
    setTimeout(() => {
      pesanSalah.style.display = 'none';
    }, 3000);
  }
}

document.getElementById('inputKey').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') cekKey();
});
</script>

</body>
</html>
